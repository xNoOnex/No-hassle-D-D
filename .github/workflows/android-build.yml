name: Build Signed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js v22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install --legacy-peer-deps

    - name: Build React App
      run: npm run build

    - name: Configure Capacitor & Android
      run: |
        npm install @capacitor/android --legacy-peer-deps
        npx cap add android
        npx cap sync android

    - name: Assemble Release Unsigned APK
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Sign APK manually
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        # Decode the base64 keystore
        echo $KEYSTORE_BASE64 | base64 --decode > app.keystore
        
        # Locate the newest Android build tools installed on the runner
        export BUILD_TOOL=$(ls -d /usr/local/lib/android/sdk/build-tools/* | tail -1)
        
        # Align and sign the APK
        $BUILD_TOOL/zipalign -v -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
        $BUILD_TOOL/apksigner sign --ks app.keystore --ks-pass pass:$STORE_PASSWORD --ks-key-alias $KEY_ALIAS --key-pass pass:$KEY_PASSWORD --out No-hassle-D-D-Signed.apk app-aligned.apk

    - name: Upload Signed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: No-hassle-D-D-Signed
        path: No-hassle-D-D-Signed.apk
